[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-scout"
version = "0.1.0"
description = "Conservative recon/discovery engine for Aether."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aether-scout = "aether_scout.cli:main"

[tool.setuptools.packages.find]
include = ["aether_scout*"]
